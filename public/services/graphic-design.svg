<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  
  <!-- Backdrop shapes -->
  <circle cx="250" cy="300" r="150" fill="none" stroke="#27272a" stroke-width="15" />
  <rect x="450" y="150" width="200" height="200" fill="none" stroke="#27272a" stroke-width="15" transform="rotate(25 550 250)" />
  
  <!-- Glowing Graphic Design Elements -->
  <!-- Bezier Pen path -->
  <path d="M 200 450 C 250 200, 450 150, 600 350" fill="none" stroke="#c084fc" stroke-width="10" filter="url(#neon)" />
  
  <!-- Control Points -->
  <circle cx="200" cy="450" r="10" fill="#f97316" filter="url(#neon)" />
  <circle cx="600" cy="350" r="10" fill="#f97316" filter="url(#neon)" />
  <line x1="200" y1="450" x2="250" y2="200" stroke="#f97316" stroke-dasharray="5 5" stroke-width="3" />
  <line x1="600" y1="350" x2="450" y2="150" stroke="#f97316" stroke-dasharray="5 5" stroke-width="3" />
  <rect x="240" y="190" width="20" height="20" fill="#38bdf8" />
  <rect x="440" y="140" width="20" height="20" fill="#38bdf8" />
  
  <!-- Colorful swatches -->
  <circle cx="350" cy="450" r="25" fill="#ec4899" />
  <circle cx="410" cy="450" r="25" fill="#eab308" />
  <circle cx="470" cy="450" r="25" fill="#3b82f6" />
</svg>
