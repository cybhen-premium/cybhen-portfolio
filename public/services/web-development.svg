<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  
  <!-- Grid Lines -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  
  <!-- Code Editor Window -->
  <rect x="150" y="120" width="500" height="360" rx="15" fill="#27272a" stroke="#3f3f46" stroke-width="2" shadow="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />
  
  <!-- Editor Header -->
  <path d="M 150 135 Q 150 120 165 120 L 635 120 Q 650 120 650 135 L 650 155 L 150 155 Z" fill="#1f1f22" />
  <circle cx="175" cy="138" r="6" fill="#ef4444" />
  <circle cx="195" cy="138" r="6" fill="#eab308" />
  <circle cx="215" cy="138" r="6" fill="#22c55e" />
  <text x="400" y="142" font-family="sans-serif" font-size="12" fill="#71717a" text-anchor="middle">page.tsx - Portfolio</text>
  
  <!-- Code Content -->
  <text x="180" y="210" font-family="monospace" font-size="22" fill="#eab308" font-weight="bold">export default function</text>
  <text x="450" y="210" font-family="monospace" font-size="22" fill="#60a5fa" font-weight="bold">Portfolio</text>
  <text x="560" y="210" font-family="monospace" font-size="22" fill="#eab308" font-weight="bold">() {</text>
  
  <text x="210" y="260" font-family="monospace" font-size="22" fill="#c084fc">return<tspan fill="#a1a1aa"> (</tspan></text>
  
  <text x="240" y="310" font-family="monospace" font-size="22" fill="#f97316">&lt;main <tspan fill="#38bdf8">className</tspan><tspan fill="#a1a1aa">=</tspan><tspan fill="#a3e635">"premium-web-app"</tspan>&gt;</text>
  
  <text x="270" y="360" font-family="monospace" font-size="22" fill="#f97316">&lt;h1&gt;<tspan fill="#f4f4f5">Building the Future</tspan>&lt;/h1&gt;</text>
  
  <text x="240" y="410" font-family="monospace" font-size="22" fill="#f97316">&lt;/main&gt;</text>
  
  <text x="210" y="450" font-family="monospace" font-size="22" fill="#a1a1aa">);</text>
  
  <!-- Floating Tech Elements -->
  <path d="M 60 400 L 100 440 L 60 480" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" filter="url(#neon)"/>
  <path d="M 740 120 L 700 160 L 740 200" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" filter="url(#neon)"/>
  
  <circle cx="680" cy="450" r="30" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 5" opacity="0.4" />
</svg>
