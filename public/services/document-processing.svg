<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  
  <!-- Back Document -->
  <rect x="280" y="80" width="300" height="400" rx="10" fill="#27272a" transform="rotate(15 430 280)" />
  
  <!-- Front Document -->
  <rect x="250" y="100" width="300" height="420" rx="10" fill="#1f1f22" stroke="#3f3f46" stroke-width="2" />
  
  <!-- Document Content (Glowing Lines) -->
  <rect x="290" y="140" width="100" height="20" rx="4" fill="#f97316" filter="url(#neon)" />
  <rect x="290" y="190" width="220" height="10" rx="5" fill="#52525b" />
  <rect x="290" y="215" width="200" height="10" rx="5" fill="#52525b" />
  <rect x="290" y="240" width="180" height="10" rx="5" fill="#52525b" />
  
  <rect x="290" y="300" width="220" height="10" rx="5" fill="#3f3f46" />
  <rect x="290" y="325" width="220" height="10" rx="5" fill="#3f3f46" />
  <rect x="290" y="350" width="150" height="10" rx="5" fill="#3f3f46" />
  
  <!-- ID Photo Area -->
  <rect x="420" y="140" width="90" height="110" rx="8" fill="#27272a" />
  <circle cx="465" cy="180" r="20" fill="#3f3f46" />
  <path d="M 435 250 C 435 220 495 220 495 250" fill="#3f3f46" />
  
  <!-- Official Orange Shield/Seal -->
  <circle cx="480" cy="420" r="40" fill="none" stroke="#f97316" stroke-width="6" stroke-dasharray="10 5" filter="url(#neon)" />
  <path d="M 480 395 L 495 410 L 480 445 L 465 410 Z" fill="#f97316" filter="url(#neon)" />
</svg>
